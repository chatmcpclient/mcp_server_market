name: Validate MCP Market

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate market and tests
        run: |
          python scripts/validate_market.py mcp_server_market.json
          python -m unittest discover -s tests -p 'test_*.py'
